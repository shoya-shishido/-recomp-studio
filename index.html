function routeHash(route){
 const parts=[route.screen];
 if(route.screen==='plan'||route.screen==='session')parts.push('day',route.day);
 if(route.screen==='session'&&route.draft)parts.push('draft',route.draft);
 if(route.modal?.kind==='video')parts.push('video',route.modal.id);

function parseAppHash(){

 let parts;try{parts=raw.split('/').map(decodeURIComponent)}catch{return null}
 const view=parts[0];if(!ROUTE_VIEWS.has(view))return null;
 const route={screen:view,day:selectedDay,draft:null,modal:null};
 for(let i=1;i+1<parts.length;i+=2){

  if(parts[i]==='draft'&&state.drafts?.[parts[i+1]])route.draft=parts[i+1];

function navigate(route={},options={}){

const displayTime=sec=>`${String(Math.floor(Math.max(0,sec)/60)).padStart(2,'0')}:${String(Math.max(0,sec)%60).padStart(2,'0')}`;
let lastTimerAlert=0;
function updateClocks(){const d=activeDraft();if(screen==='session'&&d){const diff=Math.max(0,Math.floor((Date.now()-new Date(d.startedAt).getTime())/1000));document.querySelectorAll('[data-elapsed]').forEach(x=>x.textContent=displayTime(diff))}const t=state.restTimer;if(t&&(t.end||t.paused)){const sec=t.paused?nOr(t.remaining):Math.max(0,Math.ceil((t.end-Date.now())/1000));document.querySelectorAll('[data-rest-remaining]').forEach(x=>x.textContent=displayTime(sec));if(!t.paused&&t.end&&sec===0&&lastTimerAlert!==t.end){lastTimerAlert=t.end;toast('休憩終了。次のセットへ進みましょう。');const lab=document.querySelector('.timer-label');if(lab)lab.textContent='NEXT SET / READY';if(navigator.vibrate)navigator.vibrate(70)}}}
function getDraftExercise(id){return activeDraft()?.exercises?.find(x=>x.id===id)}
function persistDraft(){save()}
function saveSessionField(target){const ex=getDraftExercise(target.dataset.ex),item=ex?.sets?.[Number(target.dataset.set)];if(!item||item.done)return;const field=target.dataset.sessionField;if(!['weight','reps','rir'].includes(field))return;item[field]=target.value;persistDraft()}
function saveCardioField(target){const draft=activeDraft();if(!draft||draft.type!=='cardio')return;const field=target.dataset.cardioField;if(field in draft.cardio){draft.cardio[field]=target.value;save()}}
function ensureNutrition(){if(!state.nutrition[nutritionDate])state.nutrition[nutritionDate]={manual:{p:0,f:0,c:0},meals:[],notes:''};const d=state.nutrition[nutritionDate];d.manual=d.manual||{p:0,f:0,c:0};d.meals=Array.isArray(d.meals)?d.meals:[];return d;}
function startRest(sec){state.restTimer={end:Date.now()+sec*1000,remaining:sec,paused:false};lastTimerAlert=0;save()}
function clearRest(){state.restTimer={end:0,remaining:0,paused:false};save()}
function finishSession(force=false){const d=activeDraft();if(!d)return;const when=new Date().toISOString(),duration=Math.max(1,Math.round((Date.now()-new Date(d.startedAt).getTime())/60000));if(d.type==='strength'){const all=d.exercises.flatMap(x=>x.sets),done=all.filter(x=>x.done).length;if(!done){toast('1セット以上完了すると保存できます。',true);return}if(done<all.length&&!force){navigate({modal:{kind:'confirm',id:'finish'}},{preserveScroll:true});return;}state.sessions.push({id:uid(),day:d.day,date:d.date,finishedAt:when,startedAt:d.startedAt,duration,type:'strength',exercises:JSON.parse(JSON.stringify(d.exercises))});}else{let c=d.cardio;if(!Number.isFinite(Number(c.minutes))||nOr(c.minutes)<=0||nOr(c.minutes)>240){toast('有酸素の実施時間を1〜240分で入力してください。',true);return}state.sessions.push({id:uid(),day:d.day,date:d.date,finishedAt:when,startedAt:d.startedAt,duration:nOr(c.minutes),type:'cardio',cardio:{...c}});}delete state.drafts[activeDraftKey];activeDraftKey=null;clearRest();save();navigate({screen:'progress',draft:null,modal:null},{replace:true});toast('セッションを保存しました。お疲れさまでした！')}
function doAction(el,event){const a=el.dataset.action;
 if(a==='switch-profile'){switchProfile(el.dataset.profile);return}
 if(a==='install-app'){
  if(installPrompt){const prompt=installPrompt;installPrompt=null;prompt.prompt();prompt.userChoice.then(x=>{if(x?.outcome==='accepted')toast('ホーム画面への追加を確認してください。');}).catch(()=>{});}
  else navigate({modal:{kind:'install',id:'howto'}},{preserveScroll:true});return;
 }
 if(a==='set-mode'){const next=el.dataset.mode;if(!activeModes()[next]||state.programMode===next)return;state.programMode=next;save();render();toast(`「${activeModes()[next].name}」に変更。進行中の記録は変更しません。`);return}
 if(a==='go-back'){navigateBack();return}
 if(a==='resume-draft'){const latest=latestDraft();if(!latest){toast('再開できるトレーニングがありません。',true);return;}navigate({screen:'session',day:latest[1].day,draft:latest[0],modal:null});return}
 if(a==='jump-next'){jumpToPending();return}
 if(a==='jump-exercise'){const card=document.getElementById('exercise-'+el.dataset.ex);if(!card)return;card.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});card.classList.add('jump-highlight');setTimeout(()=>card.classList.remove('jump-highlight'),1250);return}
 if(a==='toggle-library'){libraryExpanded=!libraryExpanded;render();return}
 if(a==='discard-draft'){navigate({modal:{kind:'confirm',id:'discard'}},{preserveScroll:true});return}
 if(a==='confirm-discard'){if(activeDraftKey){delete state.drafts[activeDraftKey];activeDraftKey=null;clearRest();save();navigate({screen:'home',draft:null,modal:null},{replace:true});toast('途中の記録を破棄しました。')}return}
 if(a==='confirm-finish'){modal=null;finishSession(true);return}
 if(a==='nav'){const next=el.dataset.view;if(!['home','plan','nutrition','progress','settings'].includes(next))return;navigate({screen:next,modal:null,draft:null});return}
 if(a==='pick-day'||a==='open-day'){const next=el.dataset.day;if(!DAY.some(d=>d.id===next))return;navigate({screen:'plan',day:next,modal:null,draft:null},{replace:screen==='plan'&&!modal});return}
 if(a==='start-day'){startSession(el.dataset.day);return}
 if(a==='session-back'){navigate({screen:'plan',draft:null,modal:null});toast('進行中の記録は保存されています。');return}
 if(a==='video'){event.stopPropagation();if(!EX[el.dataset.ex])return;modalFocusReturn=el.dataset.ex;navigate({modal:{kind:'video',id:el.dataset.ex}},{preserveScroll:true});return}
 if(a==='retry-media'){const video=document.getElementById('exercise-video');const fallback=document.getElementById('video-fallback');if(!video)return;if(fallback)fallback.hidden=true;video.load();return}
 if(a==='media-speed'){const video=document.getElementById('exercise-video');if(!video)return;const speed=Number(el.dataset.speed);if(![0.5,1,1.5].includes(speed))return;video.playbackRate=speed;document.querySelectorAll('[data-action="media-speed"]').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===speed));return}
 if(a==='close-modal'){navigateBack();return}
 if(a==='close-modal-backdrop'){if(event.target!==el)return;navigateBack();return}
 if(a==='toggle-variant'){const id=el.dataset.ex;if(!EX[id]?.alternative)return;state.variants[id]=state.variants[id]==='alt'?'primary':'alt';save();render();toast('選択した種目に変更しました。');return}
 if(a==='filter'){libraryFilter=el.dataset.filter;render();return}
 if(a==='toggle-set'){const ex=getDraftExercise(el.dataset.ex),i=Number(el.dataset.set),s=ex?.sets?.[i];if(!s)return;const def=EX[ex.id];if(s.done){s.done=false;save();render();return}const row=el.closest('tr');for(let field of ['weight','reps','rir']){const input=row?.querySelector(`[data-session-field="${field}"]`);if(input)s[field]=input.value;}if(s.weight===''||!Number.isFinite(Number(s.weight))||nOr(s.weight)<0){toast('重量を入力してください。自重のみなら0kgを入力します。',true);return}if(!Number.isInteger(Number(s.reps))||nOr(s.reps)<1||nOr(s.reps)>99){toast('回数を1〜99の範囲で入力してください。',true);return}s.done=true;const nextSame=ex.sets.slice(i+1).find(z=>!z.done);if(nextSame&&nextSame.weight==='')nextSame.weight=s.weight;const allDone=activeDraft().exercises.every(x=>x.sets.every(v=>v.done));const pair=activeDraft().mode==='classic'&&def.superset?activeDraft().exercises.find(x=>x.id!==ex.id&&EX[x.id]?.superset===def.superset):null;const pairPending=pair&&!pair.sets[i]?.done;if(!allDone&&!pairPending)startRest(def.rest);else clearRest();save();render();if(allDone)toast('全セット完了！セッションを保存してください。');return}
 if(a==='add-set'){const ex=getDraftExercise(el.dataset.ex);if(!ex||ex.sets.length>=12){toast('セット上限は12です。',true);return}const prev=ex.sets.at(-1);ex.sets.push({weight:prev?.weight??'',reps:'',rir:'',done:false});save();render();return}
 if(a==='remove-set'){const ex=getDraftExercise(el.dataset.ex);if(!ex||ex.sets.length<=1)return;if(ex.sets.at(-1).done&&!window.confirm('完了済みの最終セットを削除しますか？'))return;ex.sets.pop();save();render();return}
 if(a==='apply-previous'){const ex=getDraftExercise(el.dataset.ex);if(!ex)return;const previous=lastLogs(ex.id,ex.variant);if(!previous)return;let applied=0;for(let i=0;i<ex.sets.length;i++){if(ex.sets[i].done)continue;const old=previous.item.sets[i];if(old?.done&&old.weight!==''&&old.weight!=null){ex.sets[i].weight=old.weight;applied++;}}save();render();toast(applied?`前回の重量を${applied}セットに反映しました。`:'反映する未完了セットがありません。');return}
 if(a==='apply-suggest'){const ex=getDraftExercise(el.dataset.ex),data=suggestedLoad(el.dataset.ex,ex?.variant);if(!ex||!data?.increase)return;ex.sets.forEach(s=>{if(!s.done)s.weight=data.proposed});save();render();toast(`${EX[el.dataset.ex].name}の重量候補を入力しました。`);return}
 if(a==='finish-strength'){finishSession();return}
 if(a==='cardio-choice'){const d=activeDraft();if(d&&d.type==='cardio'){d.cardio.exercise=el.dataset.ex;save();render()}return}
 if(a==='finish-cardio'){document.querySelectorAll('[data-cardio-field]').forEach(saveCardioField);finishSession();return}
 if(a==='toggle-rest'){const t=state.restTimer;if(!t)return;if(t.paused){t.end=Date.now()+nOr(t.remaining)*1000;t.paused=false}else{t.remaining=Math.max(0,Math.ceil((nOr(t.end)-Date.now())/1000));t.end=0;t.paused=true}save();render();return}
 if(a==='extend-rest'){const t=state.restTimer;if(!t||(!t.end&&!t.paused))return;if(t.paused)t.remaining=nOr(t.remaining)+30;else t.end=nOr(t.end)+30000;save();render();return}
 if(a==='stop-rest'){clearRest();render();return}
 if(a==='delete-meal'){const d=ensureNutrition();const x=d.meals.find(x=>x.id===el.dataset.id);if(!x)return;if(window.confirm(`「${x.name}」の記録を削除しますか？`)){d.meals=d.meals.filter(x=>x.id!==el.dataset.id);save();render();toast('食事ログを削除しました。')}return}
 if(a==='delete-weight'){if(window.confirm(`${el.dataset.date}の体重記録を削除しますか？`)){state.weights=state.weights.filter(x=>x.date!==el.dataset.date);save();render();toast('体重記録を削除しました。')}return}
 if(a==='show-history'){navigate({modal:{kind:'history',id:el.dataset.id}},{preserveScroll:true});return}
 if(a==='delete-session'){if(window.confirm('このセッション記録を完全に削除しますか？')){state.sessions=state.sessions.filter(x=>x.id!==el.dataset.id);save();navigate({modal:null},{replace:true,preserveScroll:true});toast('セッション記録を削除しました。')}return}
 if(a==='save-settings'){const p={},t={};document.querySelectorAll('[data-setting]').forEach(x=>p[x.dataset.setting]=x.value===''?null:Number(x.value));document.querySelectorAll('[data-target]').forEach(x=>t[x.dataset.target]=x.value===''?0:Number(x.value));if((p.height!==null&&(p.height<100||p.height>230))||(p.startingWeight!==null&&(p.startingWeight<25||p.startingWeight>250))||p.sessionMinutes<20||p.sessionMinutes>180||Object.values(t).some(x=>!Number.isFinite(x)||x<0||x>10000)||['kcal','p','f','c'].some(k=>t[k+'Min']>t[k+'Max'])){toast('設定値を確認してください。上限は下限以上に設定します。',true);return}state.profile=p;state.targets=t;save();render();toast('設定を保存しました。');return}
 if(a==='export-json'){download(`recomp-${activeProfileId}-${nowDate()}.json`,JSON.stringify({...state,ownerProfileId:activeProfileId},null,2),'application/json');toast(`${profileLabel()}のバックアップを作成しました。`);return}
 if(a==='export-family'){let me=activeProfileId==='me'?state:readStoredState('me');let wife=activeProfileId==='wife'?state:readStoredState('wife');const payload={format:'recomp-family-v1',version:2,exportedAt:new Date().toISOString(),profiles:{me,wife}};download(`recomp-family-${nowDate()}.json`,JSON.stringify(payload,null,2),'application/json');toast('2人分のバックアップを作成しました。');return}
 if(a==='export-csv'){exportCSV();return}
 if(a==='import-json'){document.getElementById('file-import')?.click();return}
 if(a==='reset-all'){if(window.confirm(`${profileLabel()}のトレーニング・栄養・体重記録だけを消去します。他の利用者の記録は残ります。元に戻せません。続行しますか？`)){state=defaults();activeDraftKey=null;save();navigate({screen:'home',draft:null,modal:null},{replace:true});toast(`${profileLabel()}の記録を初期化しました。`)}return}
}
function download(filename,content,type){const blob=new Blob([content],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportCSV(){const head=['日付','メニュー','区分','所要時間(分)','完了セット数','外部負荷量(kg×回)','平均心拍(bpm)','運動種目'],rows=state.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[s.date,getDay(s.day).title,s.type==='strength'?'筋トレ':'有酸素',s.duration,s.type==='strength'?(s.exercises||[]).reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0):'',s.type==='strength'?countVolume(s):'',s.type==='cardio'?s.cardio?.bpm||'':'',s.type==='cardio'?EX[s.cardio?.exercise]?.name||'':'']);const esc=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download(`recomp-history-${nowDate()}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(esc).join(',')).join('\r\n'),'text/csv');toast('CSVを作成しました。')}
function validProfileData(data){return data&&typeof data==='object'&&data.version===1&&Array.isArray(data.sessions)&&Array.isArray(data.weights)&&data.profile&&data.targets&&typeof data.profile==='object'&&typeof data.targets==='object'}
function readStoredState(id){try{let raw=localStorage.getItem(storageFor(id));if(raw){const x=JSON.parse(raw);if(validProfileData(x))return x}}catch{}return defaults(id)}
function normalizedImport(s,id){const d=defaults(id),modes=id==='wife'?WIFE_MODES:PLAN_MODES;return {...d,programMode:modes[s.programMode]?s.programMode:d.programMode,profile:{...d.profile,...s.profile},targets:{...d.targets,...s.targets},sessions:s.sessions.filter(x=>x&&x.date&&x.day),weights:s.weights.filter(x=>x&&x.date),nutrition:s.nutrition&&typeof s.nutrition==='object'?s.nutrition:{},drafts:s.drafts&&typeof s.drafts==='object'?s.drafts:{},variants:s.variants&&typeof s.variants==='object'?s.variants:{},createdAt:s.createdAt||d.createdAt};}
async function importJSON(file){if(!file)return;
 try{
  const content=await file.text();if(content.length>5000000)throw Error('ファイルが大きすぎます');
  const item=JSON.parse(content);if(!item||typeof item!=='object')throw Error('JSON形式が正しくありません');
  if(item.format==='recomp-family-v1'){
   if(!validProfileData(item.profiles?.me)||!validProfileData(item.profiles?.wife))throw Error('家族用バックアップの形式が正しくありません');
   if(!window.confirm('2人分のデータをこのバックアップで置き換えます。現在の2人分のバックアップを取得しましたか？'))return;
   const a=normalizedImport(item.profiles.me,'me'),b=normalizedImport(item.profiles.wife,'wife');
   localStorage.setItem(STORAGE,JSON.stringify(a));localStorage.setItem(WIFE_STORAGE,JSON.stringify(b));
   load();activeDraftKey=null;navigate({screen:'home',draft:null,modal:null},{replace:true});toast('2人分のバックアップを復元しました。');return;
  }
  if(!validProfileData(item))throw Error('このアプリのバックアップ形式ではありません');
  const target=['me','wife'].includes(item.ownerProfileId)?item.ownerProfileId:'me';
  const label=target==='wife'?'女性':'男性';
  if(!window.confirm(`このバックアップを「${label}」の記録に復元します。${label}の既存データは置き換わります（もう一方は変更しません）。実行しますか？`))return;
  const restored=normalizedImport(item,target);localStorage.setItem(storageFor(target),JSON.stringify(restored));
  if(target===activeProfileId){load();activeDraftKey=null;navigate({screen:'home',draft:null,modal:null},{replace:true})}
  toast(`${label}の記録を復元しました。`);
 }catch(e){toast('復元できませんでした：'+e.message,true)}
}
const app=document.getElementById('app');
app.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;doAction(el,ev)});
app.addEventListener('change',ev=>{const x=ev.target;if(x.dataset.sessionField){saveSessionField(x);return}if(x.dataset.cardioField){saveCardioField(x);return}if(x.dataset.date==='nutrition'){if(/^\d{4}-\d{2}-\d{2}$/.test(x.value)){nutritionDate=x.value;render()}return}if(x.dataset.nutrField){const d=ensureNutrition(),val=nOr(x.value);if(val<0||val>999){toast('0〜999gで入力してください。',true);render();return}d.manual[x.dataset.nutrField]=val;save();render();return}if(x.hasAttribute('data-nutr-notes')){const d=ensureNutrition();d.notes=x.value.slice(0,800);save();return}if(x.dataset.field==='library-search'){libraryQuery=x.value;render();return}if(x.id==='file-import'){importJSON(x.files?.[0]);return}});
app.addEventListener('input',ev=>{const x=ev.target;if(x.dataset.sessionField){saveSessionField(x);return}if(x.dataset.cardioField){saveCardioField(x);return}if(x.hasAttribute('data-nutr-notes')){const d=ensureNutrition();d.notes=x.value.slice(0,800);save();return}if(x.dataset.field==='library-search'){libraryQuery=x.value;const wrap=document.querySelector('.video-library');if(wrap){const q=libraryQuery.toLowerCase();let count=0;wrap.querySelectorAll('.video-tile').forEach(tile=>{const id=tile.dataset.ex,ex=variantOf(id),ok=(libraryFilter==='all'||ex.category===libraryFilter)&&(ex.name.toLowerCase().includes(q)||ex.en.toLowerCase().includes(q)||ex.muscle.includes(q));tile.hidden=!ok;if(ok)count++});const empty=wrap.querySelector('.inline-search-empty');if(empty)empty.remove();if(!count)wrap.insertAdjacentHTML('beforeend','<div class="empty inline-search-empty" style="grid-column:1/-1">該当する種目はありません。検索語を変えてください。</div>')}}});
app.addEventListener('submit',ev=>{const form=ev.target;if(form.id==='meal-form'){ev.preventDefault();const fd=new FormData(form),p=Number(fd.get('p')),f=Number(fd.get('f')),c=Number(fd.get('c')),name=String(fd.get('name')||'').trim(),category=String(fd.get('category')||'食事');if(!name||[p,f,c].some(n=>!Number.isFinite(n)||n<0||n>999)){toast('食品名とPFCを正しく入力してください。',true);return}const d=ensureNutrition();d.meals.push({id:uid(),name:name.slice(0,80),category,p,f,c,createdAt:new Date().toISOString()});save();render();toast('食事を記録しました。');return}if(form.id==='weight-form'){ev.preventDefault();const fd=new FormData(form),date=String(fd.get('date')||''),weight=Number(fd.get('weight'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(weight)||weight<25||weight>300){toast('体重と日付を正しく入力してください。',true);return}weightDate=date;const same=state.weights.findIndex(x=>x.date===date);if(same>=0)state.weights[same].weight=weight;else state.weights.push({date,weight});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('体重を保存しました。');return}});
window.addEventListener('keydown',e=>{
 if(!modal)return;
 if(e.key==='Escape'&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();navigateBack();return;}
 if(e.key==='Tab'){
  const focusable=[...document.querySelectorAll('.modal button:not([disabled]),.modal a[href],.modal input:not([disabled]),.modal select:not([disabled])')].filter(x=>x.getClientRects().length);
  if(!focusable.length)return;
  const first=focusable[0],last=focusable.at(-1);
  if(e.shiftKey&&(document.activeElement===first||!document.querySelector('.modal')?.contains(document.activeElement))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(document.activeElement===last||!document.querySelector('.modal')?.contains(document.activeElement))){e.preventDefault();first.focus()}
 }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){rememberScroll();save()}});
window.addEventListener('pagehide',()=>save());
setInterval(updateClocks,1000);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
window.addEventListener('appinstalled',()=>{installPrompt=null;render();toast('ホーム画面に追加されました。');});
load();bootNavigation();
if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
})();
</script>
